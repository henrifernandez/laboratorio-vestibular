<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Laboratório Vestibular: aprenda os conceitos do vestibular mexendo neles, matéria por matéria." />
    <meta name="theme-color" content="#fbf7f0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- fontes do alfabeto latino pré-carregadas: o texto já nasce na fonte final e o cabeçalho não muda de tamanho depois -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2" />
    <title>Laboratório Vestibular</title>
    <script>
      // aplica o tema salvo antes da primeira pintura, para não piscar
      try {
        var t = localStorage.getItem('lv:v1:tema')
        if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t === 'claro' ? 'light' : 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
